<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!-- Only root owns the name; anyone may talk to it. Writes are decided by polkit, not here. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.matrixdj96.ThinkwattMX"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.matrixdj96.ThinkwattMX" send_interface="io.github.matrixdj96.ThinkwattMX"/>
    <allow send_destination="io.github.matrixdj96.ThinkwattMX" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.matrixdj96.ThinkwattMX" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.matrixdj96.ThinkwattMX" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
